# Personal site configuration for Junteng Liu's fork of Academic Pages.
# All personal values below are taken from the supplied memory graph.

locale: "en-US"
site_theme: "default"

title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: >-
  Junteng Liu is a first-year PhD candidate in the HKUST NLP Group. He graduated
  from Shanghai Jiao Tong University in June 2024 and researches natural language
  processing, machine learning, LLM reasoning and reinforcement learning, VLM
  hallucination, and LLM truthfulness and interpretability.
url: "https://magmathrushforce.github.io"
baseurl: "/LJT-Homepage"
repository: "magmathrushforce/LJT-Homepage"

# Sidebar author profile. Fields not present in memory are intentionally omitted.
author:
  avatar: ""
  name: "Junteng Liu"
  pronouns: ""
  bio: >-
    First-year PhD candidate at the HKUST NLP Group, supervised by Professor
    Junxian He. B.Eng. from Shanghai Jiao Tong University (2020-2024).
  location: "Hong Kong"
  employer: "Hong Kong University of Science and Technology"
  uri: ""
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Categories used by the existing Academic Pages publications index.
publication_category:
  arxiv:
    title: "arXiv Publications"
  conferences:
    title: "Conference Publications"

# Site settings
teaser: ""
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider: ""
  disqus:
    shortname: ""
  discourse:
    server: ""
  facebook:
    appid: ""
    num_posts: 5
    colorscheme: "light"
staticman:
  allowedFields: ["name", "email", "url", "message"]
  branch: "master"
  commitMessage: "New comment."
  filename: "comment-{@timestamp}"
  format: "yml"
  moderation: true
  path: "_data/comments/{options.slug}"
  requiredFields: ["name", "email", "message"]
  transforms:
    email: "md5"
  generatedFields:
    date:
      type: "date"
      options:
        format: "iso8601"
atom_feed:
  hide: false
  path: ""

# SEO related
google_site_verification: ""
bing_site_verification: ""
alexa_site_verification: ""
yandex_site_verification: ""

# Social sharing
twitter:
  username: "junteng88716710"
facebook:
  username: ""
  app_id: ""
  publisher: ""
og_image: ""
og_description: ""
social:
  type: "Person"
  name: "Junteng Liu"
  links:
    - "mailto:jliugi@connect.ust.hk"
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://x.com/junteng88716710"

analytics:
  provider: "false"
  google:
    tracking_id: ""

# Reading files
include:
  - ".htaccess"
  - "_pages"
  - "files"
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - ".asset-cache"
  - ".bundle"
  - ".github"
  - ".jekyll-assets-cache"
  - ".sass-cache"
  - "assets/js/_main.js"
  - "assets/js/plugins"
  - "assets/js/vendor"
  - "CHANGELOG"
  - "Capfile"
  - "config"
  - "Dockerfile"
  - "Gemfile"
  - "Gruntfile.js"
  - "gulpfile.js"
  - "LICENSE"
  - "local"
  - "log"
  - "node_modules"
  - "package.json*"
  - "Rakefile"
  - "README"
  - "tmp"
  - "vendor"
keep_files:
  - ".git"
  - ".svn"
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Template collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Default front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
