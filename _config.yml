author:
  avatar: "profile.png"
  name: "Junteng Liu"
  bio: "First-year PhD candidate in the HKUST NLP Group at the Hong Kong University of Science and Technology. Research focuses on natural language processing and machine learning, including LLM reasoning and reinforcement learning, hallucination in vision-language models, and LLM truthfulness and interpretability."
  location: "Hong Kong"
  employer: "HKUST NLP Group, Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

